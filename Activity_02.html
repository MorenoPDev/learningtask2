<html>
	<head>
		<title>..:Lists:..</title>
		<style type="text/css">
			body {
				background-color: #FCF8E6;
				font-family: verdana;
				color: #784E46;
			}
			h1 {
				font-family: "Times new roman";
				color: #7CBA65;
			}
			ol {
				background-color: #93CCD9;
				color: #D3ECF2;
			}
			ul {
				background-color: #B187FF;
				color: #D8C4FF;
			}
		</style>
	</head>
<body>
		<h1>HTML list</h1>
		<p>
			Ordered list are list that is in a particular order.
		</p>
		<ol>
			<li>President</li>
			<li>Vice President</li>
			<li>Governor</li>
			<li>Vice Governor</li>
			<li>Mayor</li>
			<li>Vice Mayor</li>
		</ol>
		<p>
			Unordered list are list that is NOT in a particular order.
		</p>
		<ul>
			<li>Banana</li>
			<li>Grapes</li>
			<li>Guava</li>
			<li>Apple</li>
			<li>Strawberry</li>
		</ul>
	</body>
</html>

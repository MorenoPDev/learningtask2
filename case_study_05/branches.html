            border-left: 6px solid #DC3545;

        }
        .branch-card h3 {

        .branch-card p {

<body>
    <div class="resto-banner">
        <img src="logo.jpg" alt="Logo" width="60">

    <div class="top-nav">
        <a href="index.html">Home</a>
        <a href="branches.html">Branches</a>

        <a href="feedback.html">Customer Feedback</a>
        <a href="contact.html">Contact Us</a>
    </div>

    <div id="branchesDisplay" class="branches-container">
        <div class="branch-card">
            <h3>Main Branch</h3>
            <p>📍 Lacson Street, Bacolod City</p>
        </div>
        
        <div class="branch-card">
            <h3>Iloilo Branch</h3>
            <p>📍 Diversion Road, Iloilo City</p>
        </div>
        
        <div class="branch-card">
            <h3>Cebu Branch</h3>
